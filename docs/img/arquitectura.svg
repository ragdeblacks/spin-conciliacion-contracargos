<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 535" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="f" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <style>
      .caja{fill:#fff;stroke:#374151;stroke-width:1.4;rx:8}
      .ext{fill:#f3f4f6;stroke:#6b7280;stroke-dasharray:5 3;rx:8}
      .nucleo{fill:#eef2ff;stroke:#3730a3;stroke-width:1.6;rx:8}
      .ia{fill:#fdf4ff;stroke:#86198f;stroke-width:1.4;rx:8}
      .t{fill:#111827}.s{fill:#4b5563;font-size:11px}.h{font-weight:bold;font-size:14px}
      .fl{stroke:#374151;stroke-width:1.4;fill:none;marker-end:url(#f)}
      .fut{stroke:#9ca3af;stroke-width:1.4;fill:none;stroke-dasharray:6 4;marker-end:url(#f)}
    </style>
  </defs>

  <!-- sistemas externos -->
  <rect x="20" y="30" width="200" height="120" class="ext"/>
  <text x="120" y="52" text-anchor="middle" class="h">Banco adquirente</text>
  <text x="120" y="76" text-anchor="middle" class="t">Portal web legacy (CSV)</text>
  <text x="120" y="96" text-anchor="middle" class="s">cambia en 3 meses</text>
  <text x="120" y="120" text-anchor="middle" class="t">API propia</text>
  <text x="120" y="138" text-anchor="middle" class="s">próximo año</text>

  <rect x="760" y="30" width="200" height="120" class="ext"/>
  <text x="860" y="52" text-anchor="middle" class="h">Core NetPay</text>
  <text x="860" y="76" text-anchor="middle" class="t">API REST: transacciones,</text>
  <text x="860" y="92" text-anchor="middle" class="t">liberar liquidación</text>
  <text x="860" y="116" text-anchor="middle" class="t">UI: bloquear saldo</text>
  <text x="860" y="134" text-anchor="middle" class="s">(sin API de bloqueo hoy)</text>

  <!-- adaptadores de entrada -->
  <rect x="250" y="20" width="170" height="40" class="caja"/>
  <text x="335" y="44" text-anchor="middle" class="t">Adaptador portal (RPA)</text>
  <rect x="250" y="70" width="170" height="40" class="caja"/>
  <text x="335" y="94" text-anchor="middle" class="t">Adaptador API banco</text>
  <rect x="250" y="120" width="170" height="40" class="caja"/>
  <text x="335" y="144" text-anchor="middle" class="t">Carga manual de CSV</text>
  <text x="335" y="178" text-anchor="middle" class="s">puerto: fuente de movimientos</text>

  <!-- adaptadores de salida -->
  <rect x="560" y="20" width="170" height="40" class="caja"/>
  <text x="645" y="44" text-anchor="middle" class="t">Liberar por API</text>
  <rect x="560" y="70" width="170" height="40" class="caja"/>
  <text x="645" y="94" text-anchor="middle" class="t">Bloquear por UI (RPA)</text>
  <rect x="560" y="120" width="170" height="40" class="caja"/>
  <text x="645" y="144" text-anchor="middle" class="t">Bloquear por API (futuro)</text>
  <text x="645" y="178" text-anchor="middle" class="s">puertos: liberador, bloqueador</text>

  <!-- núcleo -->
  <rect x="240" y="210" width="500" height="150" class="nucleo"/>
  <text x="490" y="234" text-anchor="middle" class="h">Orquestador diario (determinista)</text>
  <text x="256" y="262" class="t">1. Arranque: G-FECHA · G-SECRETOS · G-CORE-VIVO</text>
  <text x="256" y="282" class="t">2. Ingesta y normalización: G-ESQUEMA · G-VOLUMEN</text>
  <text x="256" y="302" class="t">3. Conciliación con reglas explicables → LIQUIDAR / BLOQUEAR / EXCEPCIÓN</text>
  <text x="256" y="322" class="t">4. Ejecución idempotente: bloqueos → G-ORDEN → liquidaciones (G-UMBRAL)</text>
  <text x="256" y="342" class="t">5. Cierre: G-CIERRE · G-DERIVA · reporte y alertas</text>

  <!-- libro mayor -->
  <rect x="20" y="230" width="200" height="110" class="caja"/>
  <text x="120" y="254" text-anchor="middle" class="h">Libro mayor</text>
  <text x="120" y="276" text-anchor="middle" class="t">append-only</text>
  <text x="120" y="294" text-anchor="middle" class="s">corridas · decisiones · acciones</text>
  <text x="120" y="310" text-anchor="middle" class="s">claves de idempotencia · gates</text>
  <text x="120" y="326" text-anchor="middle" class="s">aprobaciones · sugerencias</text>

  <!-- humano -->
  <rect x="760" y="230" width="200" height="110" class="caja"/>
  <text x="860" y="254" text-anchor="middle" class="h">Operaciones</text>
  <text x="860" y="276" text-anchor="middle" class="t">cola de excepciones</text>
  <text x="860" y="294" text-anchor="middle" class="t">doble control (umbral)</text>
  <text x="860" y="312" text-anchor="middle" class="t">reporte matutino · Slack</text>
  <text x="860" y="330" text-anchor="middle" class="s">botón de paro</text>

  <!-- IA -->
  <rect x="240" y="400" width="500" height="112" class="ia"/>
  <text x="490" y="424" text-anchor="middle" class="h">Asistente de triaje (fuera del camino crítico)</text>
  <text x="256" y="446" class="t">1. Tokenizar datos sensibles → G-LLM-PII · G-LLM-PRESUPUESTO</text>
  <text x="256" y="464" class="t">2. Puerto AsistenteTriaje → adaptador: nulo · Anthropic · OpenAI-compatible</text>
  <text x="256" y="482" class="t">3. Validar esquema y catálogo → sugerencia al analista (o fallback)</text>
  <text x="256" y="500" class="s">nunca ejecuta, nunca ve identificadores reales, siempre con fallback</text>

  <!-- flechas -->
  <path d="M220,80 L250,40" class="fl"/>
  <path d="M220,110 L250,90" class="fut"/>
  <path d="M335,160 L335,210" class="fl"/>
  <path d="M730,40 L760,70" class="fl"/>
  <path d="M730,90 L760,110" class="fl"/>
  <path d="M730,140 L760,100" class="fut"/>
  <path d="M645,210 L645,160" class="fl"/>
  <path d="M240,285 L220,285" class="fl"/>
  <path d="M740,285 L760,285" class="fl"/>
  <path d="M490,360 L490,400" class="fl"/>
  <path d="M740,456 L860,456 L860,340" class="fl"/>
  <text x="866" y="400" class="s">sugerencias</text>
</svg>

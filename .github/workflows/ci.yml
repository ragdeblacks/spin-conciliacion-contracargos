name: ci
on: [push, pull_request]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {enable-cache: false}   # el paso de limpieza de caché falla dentro del contenedor de Playwright
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run playwright install chromium
      - name: pruebas unitarias, integración y RPA
        run: uv run pytest
      - name: corrida de demostración (modo sombra, contra los mocks)
        run: |
          uv run uvicorn mocks.banco_portal.app:app --port 8001 &
          uv run uvicorn mocks.core_netpay.app:app --port 8002 &
          sleep 3
          set -a && . ./.env.example && set +a
          uv run conciliador correr --fecha 2026-10-15 --modo sombra --json
          uv run conciliador reporte --corrida 1 --salida reporte-demo.md
      - uses: actions/upload-artifact@v4
        with: {name: reporte-demo, path: reporte-demo.md}
  imagen:
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t spin-conciliacion:${{ github.sha }} .
